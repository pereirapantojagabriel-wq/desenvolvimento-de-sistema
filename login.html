<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessar Sistema — TrampoJovem</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="main-nav"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <!-- Atalhos Demo -->
        <div class="demo-bar mb-4 text-center">
          <small class="fw-bold text-muted d-block mb-2">
            <i class="bi bi-stars text-warning me-1"></i> Acesso com 1 clique para avaliação:
          </small>
          <div class="d-flex justify-content-center gap-2 flex-wrap">
            <button type="button" class="btn btn-sm btn-outline-primary fw-semibold" onclick="preencherDemo('gabriel@demo.com', '123456')">
              <i class="bi bi-person-fill"></i> Usar Gabriel (Candidato)
            </button>
            <button type="button" class="btn btn-sm btn-outline-success fw-semibold" onclick="preencherDemo('empresa@demo.com', '123456')">
              <i class="bi bi-building"></i> Usar InovaTech (Empresa)
            </button>
          </div>
        </div>

        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-header bg-white border-0 pt-4 pb-0 text-center">
            <div class="mb-2">
              <i class="bi bi-person-circle fs-1 text-primary"></i>
            </div>
            <h3 class="fw-bold mb-3 text-dark">Portal de Acesso</h3>

            <!-- Abas Entrar e Cadastrar -->
            <ul class="nav nav-pills nav-fill bg-light p-1 rounded-pill mb-3" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active rounded-pill fw-semibold" id="tab-login-btn" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link rounded-pill fw-semibold" id="tab-register-btn" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab">
                  <i class="bi bi-person-plus me-1"></i> Criar Conta
                </button>
              </li>
            </ul>
          </div>

          <div class="card-body p-4 pt-2">
            <div class="tab-content" id="authTabsContent">
              
              <!-- TAB LOGIN -->
              <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
                <form id="form-login" onsubmit="realizarLogin(event)">
                  <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">E-mail</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                      <input type="email" id="login-email" class="form-control border-start-0" placeholder="seuemail@exemplo.com" required>
                    </div>
                  </div>

                  <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <label class="form-label fw-semibold small text-muted mb-0">Senha</label>
                      <a href="recuperar-senha.html" class="text-decoration-none small text-primary fw-semibold">
                        <i class="bi bi-question-circle me-1"></i>Esqueceu a senha?
                      </a>
                    </div>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                      <input type="password" id="login-senha" class="form-control border-start-0" placeholder="Sua senha secreta" required>
                    </div>
                  </div>

                  <button type="submit" id="btn-submit-login" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-2 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Acessar Minha Conta
                  </button>
                </form>
              </div>

              <!-- TAB CADASTRO -->
              <div class="tab-pane fade" id="tab-register" role="tabpanel">
                <form id="form-register" onsubmit="realizarCadastro(event)">
                  
                  <!-- Seleção do Tipo de Usuário -->
                  <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted d-block">Tipo de Perfil</label>
                    <div class="row g-2">
                      <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_usuario" id="tipo_candidato" value="candidato" checked onchange="toggleCamposCandidato()">
                        <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="tipo_candidato">
                          <i class="bi bi-mortarboard fs-4 mb-1"></i>
                          <span class="fw-bold">Candidato</span>
                          <small style="font-size: 0.75rem;">Estágio / Aprendiz</small>
                        </label>
                      </div>
                      <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_usuario" id="tipo_empresa" value="empresa" onchange="toggleCamposCandidato()">
                        <label class="btn btn-outline-success w-100 py-2 d-flex flex-column align-items-center rounded-3" for="tipo_empresa">
                          <i class="bi bi-building fs-4 mb-1"></i>
                          <span class="fw-bold">Empresa</span>
                          <small style="font-size: 0.75rem;">Publicar Vagas</small>
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted" id="label-nome">Nome Completo</label>
                    <input type="text" id="reg-nome" class="form-control" placeholder="Seu nome completo" required>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">E-mail</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="seuemail@exemplo.com" required>
                  </div>

                  <div class="row g-2 mb-3">
                    <div class="col-md-6">
                      <label class="form-label fw-semibold small text-muted">Senha (min. 6 dígitos)</label>
                      <input type="password" id="reg-senha" class="form-control" placeholder="••••••" minlength="6" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-semibold small text-muted">Telefone / WhatsApp</label>
                      <input type="text" id="reg-telefone" class="form-control" placeholder="(69) 99999-9999">
                    </div>
                  </div>

                  <!-- Campos extras para candidato -->
                  <div id="campos-candidato-extras">
                    <div class="mb-3">
                      <label class="form-label fw-semibold small text-muted">Escolaridade / Formação</label>
                      <input type="text" id="reg-formacao" class="form-control" placeholder="Ex: 3º Ano Técnico em Informática">
                    </div>
                    <div class="mb-3">
                      <label class="form-label fw-semibold small text-muted">Habilidades Técnicas</label>
                      <input type="text" id="reg-habilidades" class="form-control" placeholder="Ex: Informática básica, HTML, Organização">
                    </div>
                    <div class="mb-3">
                      <label class="form-label fw-semibold small text-muted">Apresentação / Sobre Você</label>
                      <textarea id="reg-bio" class="form-control" rows="2" placeholder="Fale um pouco sobre seus objetivos e interesses..."></textarea>
                    </div>
                  </div>

                  <button type="submit" id="btn-submit-register" class="btn btn-success w-100 py-2 fw-semibold rounded-3 shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> Concluir Cadastro
                  </button>
                </form>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>

  <script>
    function toggleCamposCandidato() {
      const isCandidato = document.getElementById('tipo_candidato').checked;
      document.getElementById('campos-candidato-extras').style.display = isCandidato ? 'block' : 'none';
      document.getElementById('label-nome').textContent = isCandidato ? 'Nome Completo do Estudante' : 'Razão Social / Nome da Empresa';
    }

    function preencherDemo(email, senha) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-senha').value = senha;
      document.getElementById('tab-login-btn').click();
    }

    async function realizarLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-login');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Entrando...';

      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;

      try {
        const res = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: { email, senha }
        });

        setToken(res.token);
        setCurrentUser(res.user);
        showToast(res.message, 'success');

        setTimeout(() => {
          if (res.user.tipo_usuario === 'empresa') {
            window.location.href = 'empresa-vagas.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Acessar Minha Conta';
      }
    }

    async function realizarCadastro(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-register');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Registrando...';

      const tipo_usuario = document.querySelector('input[name="tipo_usuario"]:checked').value;
      const nome = document.getElementById('reg-nome').value;
      const email = document.getElementById('reg-email').value;
      const senha = document.getElementById('reg-senha').value;
      const telefone = document.getElementById('reg-telefone').value;
      const formacao = document.getElementById('reg-formacao').value;
      const habilidades = document.getElementById('reg-habilidades').value;
      const bio = document.getElementById('reg-bio').value;

      try {
        const res = await apiFetch('/api/auth/register', {
          method: 'POST',
          body: {
            nome,
            email,
            senha,
            tipo_usuario,
            telefone,
            formacao,
            habilidades,
            bio
          }
        });

        setToken(res.token);
        setCurrentUser(res.user);
        showToast(res.message, 'success');

        setTimeout(() => {
          if (res.user.tipo_usuario === 'empresa') {
            window.location.href = 'empresa-vagas.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 600);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Concluir Cadastro';
      }
    }
  </script>
</body>
</html>
