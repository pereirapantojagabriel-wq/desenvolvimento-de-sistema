<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Candidaturas — TrampoJovem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="main-nav"></div>

  <main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="fw-bold text-dark mb-1">
          <i class="bi bi-journal-check text-primary me-2"></i>Minhas Candidaturas
        </h2>
        <p class="text-muted mb-0">Acompanhe o andamento dos processos seletivos em que você está participando (RF13).</p>
      </div>
      <a href="index.html" class="btn btn-outline-primary fw-semibold">
        <i class="bi bi-plus-circle me-1"></i> Explorar Mais Vagas
      </a>
    </div>

    <!-- Lista de Candidaturas -->
    <div class="card shadow-sm border-0 rounded-4 bg-white overflow-hidden">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light text-uppercase small text-muted">
              <tr>
                <th class="ps-4 py-3">Vaga / Cargo</th>
                <th class="py-3">Empresa</th>
                <th class="py-3">Tipo</th>
                <th class="py-3">Data Inscrição</th>
                <th class="py-3">Status do Processo</th>
                <th class="pe-4 py-3 text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="lista-candidaturas">
              <tr>
                <td colspan="6" class="text-center py-5">
                  <div class="spinner-border text-primary" role="status"></div>
                  <p class="text-muted mt-2 mb-0">Carregando suas candidaturas...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      if (user.tipo_usuario !== 'candidato') {
        window.location.href = 'empresa-vagas.html';
        return;
      }
      carregarCandidaturas();
    });

    async function carregarCandidaturas() {
      const tbody = document.getElementById('lista-candidaturas');

      try {
        const res = await apiFetch('/api/applications/my-applications');
        const apps = res.applications || [];

        if (apps.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center py-5">
                <i class="bi bi-inbox fs-1 text-muted"></i>
                <h5 class="fw-bold text-muted mt-3">Você ainda não se candidatou a nenhuma vaga.</h5>
                <p class="text-muted small">Navegue pelas vagas abertas e envie sua candidatura!</p>
                <a href="index.html" class="btn btn-primary btn-sm rounded-pill px-4">Ver Vagas Disponíveis</a>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = apps.map(app => {
          let badgeStatusClass = 'badge-status-analise';
          let statusIcon = 'bi-hourglass-split';

          if (app.status_candidatura === 'Aprovado') {
            badgeStatusClass = 'badge-status-aprovado';
            statusIcon = 'bi-check-circle-fill';
          } else if (app.status_candidatura === 'Reprovado') {
            badgeStatusClass = 'badge-status-reprovado';
            statusIcon = 'bi-x-circle-fill';
          }

          const badgeTipo = app.tipo_contratacao === 'Estágio' ? 'job-badge-estagio' : 'job-badge-aprendiz';
          const dataInscricao = new Date(app.data_candidatura).toLocaleDateString('pt-BR');

          return `
            <tr>
              <td class="ps-4">
                <div class="fw-bold text-dark">${escapeHtml(app.vaga_titulo)}</div>
                <small class="text-muted"><i class="bi bi-geo-alt me-1"></i>${escapeHtml(app.localidade)}</small>
              </td>
              <td>
                <span class="fw-semibold text-secondary">${escapeHtml(app.empresa_nome)}</span>
              </td>
              <td>
                <span class="badge ${badgeTipo} px-2 py-1 rounded-pill small">${app.tipo_contratacao}</span>
              </td>
              <td class="text-muted small">
                <i class="bi bi-calendar3 me-1"></i>${dataInscricao}
              </td>
              <td>
                <span class="badge ${badgeStatusClass} px-3 py-2 rounded-pill fs-7 d-inline-flex align-items-center gap-1">
                  <i class="bi ${statusIcon}"></i> ${app.status_candidatura}
                </span>
              </td>
              <td class="pe-4 text-end">
                <a href="index.html" class="btn btn-sm btn-outline-secondary">
                  <i class="bi bi-eye me-1"></i> Ver Vaga
                </a>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-5 text-danger">
              <i class="bi bi-exclamation-triangle fs-2"></i>
              <p class="mt-2 mb-0">${err.message}</p>
            </td>
          </tr>
        `;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
