<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidatos da Vaga — TrampoJovem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="main-nav"></div>

  <main class="container my-5">
    
    <!-- Topo com Navegação de Retorno -->
    <div class="mb-4">
      <a href="empresa-vagas.html" class="btn btn-outline-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left me-1"></i> Voltar para Painel de Vagas
      </a>
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <span id="vaga-tipo-badge" class="badge mb-2"></span>
            <h3 class="fw-bold mb-1 text-dark" id="vaga-titulo-topo">Carregando vaga...</h3>
            <p class="text-muted small mb-0">
              <i class="bi bi-geo-alt me-1"></i> <span id="vaga-localidade-topo"></span> &bull; 
              <i class="bi bi-calendar-event ms-2 me-1"></i> Prazo: <span id="vaga-prazo-topo"></span>
            </p>
          </div>
          <div class="text-end">
            <span class="badge bg-primary px-3 py-2 fs-6 rounded-pill" id="total-inscritos-badge">
              0 Candidatos
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista de Candidatos Inscritos (RF14) -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold text-dark mb-0">
        <i class="bi bi-people-fill text-primary me-2"></i>Candidatos Inscritos e Avaliação (RF14, RF15)
      </h5>
    </div>

    <div id="candidatos-container" class="row g-4">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Carregando candidatos inscritos...</p>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const idVaga = urlParams.get('id_vaga');

    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      if (user.tipo_usuario !== 'empresa') {
        window.location.href = 'index.html';
        return;
      }

      if (!idVaga) {
        alert('Vaga não selecionada!');
        window.location.href = 'empresa-vagas.html';
        return;
      }

      carregarCandidatos();
    });

    async function carregarCandidatos() {
      const container = document.getElementById('candidatos-container');

      try {
        const res = await apiFetch(`/api/applications/job/${idVaga}`);
        const job = res.job;
        const apps = res.applications || [];

        // Atualizar cabeçalho da vaga
        document.getElementById('vaga-titulo-topo').textContent = job.titulo;
        document.getElementById('vaga-localidade-topo').textContent = job.localidade;
        document.getElementById('vaga-prazo-topo').textContent = job.prazo_candidatura ? job.prazo_candidatura.split('-').reverse().join('/') : '-';

        const tipoBadge = document.getElementById('vaga-tipo-badge');
        tipoBadge.textContent = job.tipo_contratacao;
        tipoBadge.className = `badge ${job.tipo_contratacao === 'Estágio' ? 'job-badge-estagio' : 'job-badge-aprendiz'} px-3 py-1 rounded-pill mb-1`;

        document.getElementById('total-inscritos-badge').textContent = `${apps.length} Candidato${apps.length === 1 ? '' : 's'}`;

        if (apps.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-person-x fs-1 text-muted"></i>
                <h5 class="fw-bold text-muted mt-3">Nenhum candidato inscrito até o momento.</h5>
                <p class="text-muted small mb-0">Divulgue o link da vaga para receber inscrições de estudantes e jovens aprendizes.</p>
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = apps.map(app => {
          const dataInscricao = new Date(app.data_candidatura).toLocaleDateString('pt-BR');

          return `
            <div class="col-12">
              <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                <div class="row align-items-center">
                  
                  <!-- Dados Pessoais do Candidato -->
                  <div class="col-lg-5 mb-3 mb-lg-0">
                    <div class="d-flex align-items-start gap-3">
                      <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 52px; height: 52px; font-size: 1.5rem;">
                        <i class="bi bi-person-fill"></i>
                      </div>
                      <div>
                        <h5 class="fw-bold text-dark mb-1">${escapeHtml(app.candidato_nome)}</h5>
                        <div class="text-muted small mb-1">
                          <i class="bi bi-envelope me-1"></i> ${escapeHtml(app.candidato_email)}
                        </div>
                        <div class="text-muted small">
                          <i class="bi bi-telephone me-1"></i> ${escapeHtml(app.candidato_telefone || 'Não informado')}
                        </div>
                        <small class="text-secondary d-block mt-2">
                          <i class="bi bi-clock-history me-1"></i> Candidatou-se em: <strong>${dataInscricao}</strong>
                        </small>
                      </div>
                    </div>
                  </div>

                  <!-- Perfil Acadêmico e Habilidades -->
                  <div class="col-lg-4 mb-3 mb-lg-0 border-start ps-lg-4">
                    <div class="mb-2">
                      <small class="text-muted fw-bold d-block"><i class="bi bi-mortarboard me-1"></i> Formação:</small>
                      <span class="text-dark small">${escapeHtml(app.candidato_formacao || 'Não informada')}</span>
                    </div>
                    <div class="mb-2">
                      <small class="text-muted fw-bold d-block"><i class="bi bi-stars me-1"></i> Habilidades:</small>
                      <span class="badge bg-light text-dark border small">${escapeHtml(app.candidato_habilidades || 'Nenhuma habilidade cadastrada')}</span>
                    </div>
                    ${app.candidato_bio ? `
                      <div>
                        <small class="text-muted fw-bold d-block"><i class="bi bi-chat-quote me-1"></i> Sobre o candidato:</small>
                        <p class="text-secondary small mb-0 text-truncate" title="${escapeHtml(app.candidato_bio)}">${escapeHtml(app.candidato_bio)}</p>
                      </div>
                    ` : ''}
                  </div>

                  <!-- Gestão de Status (RF15) -->
                  <div class="col-lg-3 text-lg-end border-start ps-lg-4">
                    <label class="form-label fw-bold small text-muted d-block text-lg-end">Alterar Status (RF15)</label>
                    <select class="form-select form-select-sm fw-semibold shadow-sm" onchange="alterarStatusCandidatura(${app.id_candidatura}, this.value)">
                      <option value="Em análise" ${app.status_candidatura === 'Em análise' ? 'selected' : ''}>⏳ Em análise</option>
                      <option value="Aprovado" ${app.status_candidatura === 'Aprovado' ? 'selected' : ''}>✅ Aprovado</option>
                      <option value="Reprovado" ${app.status_candidatura === 'Reprovado' ? 'selected' : ''}>❌ Reprovado</option>
                    </select>
                    
                    <div class="mt-2 text-lg-end">
                      <span class="badge ${getStatusBadgeClass(app.status_candidatura)} px-2 py-1">
                        Status atual: ${app.status_candidatura}
                      </span>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `
          <div class="col-12 text-center py-5 text-danger">
            <i class="bi bi-exclamation-triangle fs-2"></i>
            <p class="mt-2">${err.message}</p>
          </div>
        `;
      }
    }

    async function alterarStatusCandidatura(idCandidatura, novoStatus) {
      try {
        const res = await apiFetch(`/api/applications/${idCandidatura}/status`, {
          method: 'PATCH',
          body: { status: novoStatus }
        });
        showToast(res.message, 'success');
        carregarCandidatos();
      } catch (err) {
        showToast(err.message, 'error');
        carregarCandidatos();
      }
    }

    function getStatusBadgeClass(status) {
      if (status === 'Aprovado') return 'badge-status-aprovado';
      if (status === 'Reprovado') return 'badge-status-reprovado';
      return 'badge-status-analise';
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
